<style>
:root{--bg:#FAF6F0;--card:#fff;--ink:#2D2A26;--muted:#8A7F72;--accent:#C05621;--accent-d:#9C4218;--line:#EDE4D6;--chip:#F1E8D8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:2}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}
header{text-align:center;padding:36px 0 8px}

.chip{padding:8px 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;font-size:.9rem;color:var(--ink)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
.card h3{font-size:1.15rem;margin-bottom:8px}
.badge{display:inline-block;background:var(--chip);color:var(--accent-d);font-size:.78rem;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.card .meta{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.card .excerpt{font-size:.9rem;color:#5c554b}
.tags{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;background:#F6F1E7;color:#8A7F72;padding:2px 10px;border-radius:999px}
.empty{text-align:center;color:var(--muted);padding:60px 0;display:none}
.detail{display:none}
.back{background:none;border:none;color:var(--accent);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:16px}
.recipe{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px}

.recipe .src{font-size:.85rem;color:var(--muted);margin-bottom:20px}
.recipe .src a{color:var(--accent)}
.recipe h3.sec{margin:26px 0 10px;font-size:1.2rem;color:var(--accent-d);border-bottom:2px solid var(--line);padding-bottom:6px}
.recipe h4{margin:14px 0 6px;font-size:1rem}
.recipe ul,.recipe ol{padding-right:22px;margin:8px 0}
.recipe li{margin-bottom:6px}
.recipe ol li{margin-bottom:14px}
.recipe ol li::marker{font-weight:800;color:var(--accent)}
.ing-box{background:#FDF9F3;border:1px dashed var(--line);border-radius:14px;padding:18px 22px;margin:10px 0}
.note{background:#FFF8E7;border-right:4px solid #E8B93E;border-radius:8px;padding:12px 18px;margin:14px 0;font-size:.95rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:48px}
@media(max-width:600px){.recipe{padding:20px}header h1{font-size:1.6rem}}
</style>

د بشکن و با چنگال هم بزن. پودر سوخاری رو هم توی یه بشقاب دیگه بریز.</li>\n</ol>\n<p>اول هر ورقه مرغ رو کامل بزن توی تخم‌مرغ (هر دو طرف)، بذار اضافه‌ش بچکه، بعد بغلتون توی پودر سوخاری و با دست فشار بده تا همه‌جاش پوشیده بشه. تخم‌مرغ نقش چسب رو داره که سوخاری به مرغ بچسبه.</p>\n<ol>\n<li>توی یه ماهیتابه روغن بریز و بذار داغ بشه (سرخِ کم‌عمق — روغن به اندازه‌ای که کف ماهیتابه رو بپوشونه و نصف ضخامت مرغ رو بگیره).</li>\n</ol>\n<p>کتلت‌ها رو بنداز توی روغن داغ. چون مرغ خیلی نازکه، خیلی سریع می‌پزه: حدود ۲ دقیقه هر طرف، تا طلایی بشن.</p>\n<p>نشونه‌ی پخت کامل: در ویدیو با دماسنج دیجیتال نشون داده شد که دمای داخل مرغ باید به ۷۵ درجه‌ی سانتی‌گراد برسه. اگه دماسنج نداری، یه برش کوچیک بزن وسط ضخیم‌ترین قسمتش — نباید هیچ قسمت صورتی یا خامی دیده بشه و آبش باید شفاف باشه، نه صورتی.</p>\n<p>کتلت‌های طلایی‌شده رو از ماهیتابه دربیار و بذار روی دستمال کاغذی یا توری تا روغن اضافه‌شون گرفته بشه.</p>\n<ol>\n<li>اسپاگتی رو توی قابلمه‌ی آب جوش بپز. (مقدار نمک آب و زمان پخت در ویدیو مشخص نیست — طبق معمول: آبِ نمک‌دار و زمانِ روی بسته‌بندی تا آل‌دنته.)</li>\n</ol>\n<p>قبل از آبکش کردن، ۱/۴ پیمانه از آبِ پاستا رو نگه دار.</p>\n<ol>\n<li>سس: توی یه ماهیتابه، ۲ قاشق غذاخوری کره و ۲ قاشق غذاخوری روغن زیتون رو با هم گرم کن. (ترکیب کره و روغن زیتون هم طعم کره رو میده، هم جلوی سوختن کره رو می‌گیره.)</li>\n</ol>\n<p>۱ پیاز کوچکِ نگینی‌خردشده و ۴ حبه سیرِ خردشده رو اضافه کن و حدود ۲ دقیقه تفت بده تا نرم و شیشه‌ای بشن — نه اینکه قهوه‌ای و سوخته بشن.</p>\n<ol>\n<li>۳۰۰ میلی‌لیتر خامه رو بریز توی ماهیتابه. بعد ۱ قاشق چای‌خوری مخلوط سبزی خشک، ۱/۲ قاشق چای‌خوری نمک، ۱/۲ قاشق چای‌خوری فلفل پرک و ۱/۴ پیمانه آبِ پاستایی که نگه داشتی رو اضافه کن.</li>\n</ol>\n<p>بذار روی حرارت ملایم تا سس غلیظ بشه — آبِ پاستا به خاطر نشاسته‌ش کمک می‌کنه سس قوام بگیره و به پاستا بچسبه. هر از گاهی هم بزن که ته نگیره.</p>\n<ol>\n<li>۳ تا ۴ قاشق غذاخوری پارمزان رنده‌شده رو اضافه کن و هم بزن تا کاملاً توی سسِ داغ آب بشه. پارمزان هم طعم میده، هم سس رو غلیظ‌تر می‌کنه. اگه سس خیلی غلیظ شد، کمی آبِ پاستا اضافه کن؛ اگه رقیق بود، بذار i>شوید و جعفری خشک، پودر پیاز، پودر سیر، نمک و فلفل — به میزان دلخواه</li>\n</ul>", "method": "<ol>\n<li>سینه‌ی مرغ رو بشور و خشک کن، بعد به نوارهای بلند و هم‌اندازه (مثل انگشت) برش بزن — اینا همون «تندر»های مرغ هستن. برشِ هم‌اندازه خیلی مهمه چون اگه یکی کلفت و یکی نازک باشه، نازک‌ها می‌سوزن و کلفت‌ها خام می‌مونن.</li>\n</ol>\n<p>نوارها رو بریز توی یه کاسه‌ی شیشه‌ای. نصف پیمانه شیر، نصف پیمانه ماست، ۲ قاشق غذاخوری سس تند، از هر ادویه ۱ قاشق چای‌خوری (پاپریکای دودی، پودر سیر، پودر پیاز، فلفل سیاه) و چند قطره آب‌لیمو رو اضافه کن و با دست یا قاشق خوب مخلوط کن تا همه‌ی نوارها به مرینیت آغشته بشن.</p>\n<p>(زمان مرینیت در ویدیو مشخص نیست — احتمالاً در توضیح صوتی گفته شده. راهنمای کلی: حداقل ۱ تا ۲ ساعت در یخچال، و اگه وقت داری یک شب تا صبح، طعمش خیلی بهتر میشه. شیر و ماست بافت مرغ رو نرم و آبدار می‌کنن.)</p>\n<ol>\n<li>مواد خشک رو توی یه ظرف تخت و پهن (مثل سینی یا بشقاب گود) با هم مخلوط کن: آرد، نشاسته‌ی ذرت، بکینگ‌پودر و ادویه‌ها. نشاسته‌ی ذرت رازِ تردیِ کاوره — حذفش نکن.</li>\n</ol>\n<p>نوارهای مرغ رو یکی‌یکی از مرینیت دربیار (بذار اضافه‌ی مرینیت بچکه) و بغلتون توی مخلوط آرد. با دست آرد رو روی مرغ فشار بده و بپاش تا همه‌جاش کاملاً پوشیده بشه — هیچ قسمتِ خیسی نباید دیده بشه. (در ویدیو فقط یک بار آردزدن نشون داده شد، بدون دوباره فرو بردن در مرینیت.)</p>\n<p>نوارهای کاورشده رو بذار کنار روی یه سینی یا بشقاب. اگه ۱۰-۱۵ دقیقه توی یخچال استراحت بدی، کاور بهتر به مرغ می‌چسبه و موقع سرخ کردن نمی‌ریزه — این یه ترفند کلیه، نه از ویدیو.</p>\n<ol>\n<li>توی یه ماهیتابه‌ی گود یا قابلمه، روغنِ فراوون بریز — به اندازه‌ای که نوارها توش شناور بشن (سرخِ عمیق). بذار روی شعله‌ی متوسط‌رو‌به‌زیاد تا روغن کاملاً داغ بشه.</li>\n</ol>\n<p>تست داغی روغن: یه ذره از مخلوط آرد بنداز توی روغن؛ اگه سریع سیز کرد و بالا اومد، آماده‌ست. اگه روغن داغ نباشه، مرغ روغن رو به خودش می‌کشه و چرب و خمیری میشه.</p>\n<p>با انبر، نوارها رو یکی‌یکی و با فاصله بنداز توی روغن داغ — شلوغ نکن چون دمای روغن میفته. تا وقتی طلایی-قهوه‌ای بشن سرخ کن؛ نشونه‌ی آمادگی همون رنگ طلایی و حباب‌زدنِ شدیدِ روغنه. (زمان دقیق هر طرف د ن و بریز روی گوجه‌ها. آروم هم بزن تا همه به سس آغشته بشن.</p>\n<h4>۴. مرغ رو بپز.</h4>\n<p>سینه‌ی مرغ رو اول با دستمال کاغذی کاملاً خشک کن (این کار باعث میشه مرغ سرخ و طلایی بشه، نه اینکه بخارپز بشه). بعد به تکه‌های هم‌اندازه برش بزن — مثلاً مکعب‌های ۲ تا ۳ سانتی یا نوارهای انگشتی — تا همه یکدست بپزن. دو طرف تکه‌ها رو با نمک و پاپریکا مزه‌دار کن.</p>\n<p>یه ماهیتابه رو روی شعله‌ی متوسط‌رو‌به‌زیاد بذار و کمی روغن بریز؛ صبر کن روغن کاملاً داغ بشه (یه قطره آب بپاش، اگه سیز کرد آماده‌ست). تکه‌های مرغ رو بچین توی ماهیتابه طوری که به هم نچسبن و شلوغ نشه (اگه جا کم بود، در دو مرحله سرخ کن). هر طرف رو حدود ۴ تا ۵ دقیقه سرخ کن تا طلایی بشه. برای مطمئن شدن از پخت، یه تکه رو نصف کن — داخلش نباید صورتی باشه. مرغ‌های پخته رو بذار روی یه بشقاب و چند دقیقه استراحت بده تا آبشون حفظ بشه.</p>\n<h4>۵. سرو کن.</h4>\n<p>پاستای سس‌دار رو بکش توی بشقاب، سالاد گوجه رو روش بریز و تکه‌های مرغ رو بچین روش. اگه دوست داشتی، کمی پیازچه‌ی تازه‌ی اضافه هم روش بپاش.</p>", "notes": "<ul>\n<li>چون این نسخه سالادی و سرده، پاستا رو بذار کمی از داغی بیفته قبل از اینکه با سس اسکیر قاطی کنی؛ اسکیرِ سرد روی پاستای خیلی داغ ممکنه بافتش رو از دست بده.</li>\n<li>اگه گرم می‌خوای، پاستای داغِ آبکش‌شده رو مستقیم با سس مخلوط کن و مرغ داغ رو روش بذار — همچنان خوشمزه میشه.</li>\n<li>وگتا یه ادویه‌ی گیاهی-نمکیِ بالکانیه؛ اگه نداری، مخلوط نمک + کمی پودر سبزی خشک (مثل آویشن یا اورگانو) جواب میده.</li>\n</ul>", "id": "pesto-skyr-pasta-chicken", "category": "غذای اصلی", "tags": ["پاستا", "مرغ", "سرد"], "search": "پاستای خامه‌ای پستو-اسکیر با مرغ ۲۲۰ گرم پاستا (وزن خشک) ۵۰۰ گرم اسکیر (ماست ایسلندی؛ جایگزین: ماست چکیده یا یونانی غلیظ) ۱۲۰ میلی‌لیتر آبِ پاستا (آبی که پاستا توش پخته شده) ۳ قاشق غذاخوری پستوی قرمز (Pesto Rosso) ۱ قاشق چای‌خوری پر پودر پیاز ۲ حبه سیر ۲ قاشق چای‌خوری ادویه‌ی وگتا (ادویه‌ی گیاهی-نمکی؛ هر ادویه‌ی مشابه داری جایگزین کن) + کمی فلفل (اختیاری) ۲۵۰ گرم گوجه‌ی گیلاسی (چری) پیازچه‌ی تازه (مقدارش در ویدیو مشخص نیست؛ حدود ۳ تا ۴ ساقه کافیه) ۱ قاشق غذاخوری شیره‌ی انار + ۱ قاشق غذاخوری آب‌لیمو نصف قاشق چای     const b = document.createElement('button');
    b.className = 'chip' + (c===activeCat?' active':'');
    b.textContent = c;
    b.onclick = ()=>{activeCat=c;render();};
    box.appendChild(b);
  });
}
function cardHTML(r){
  return `<div class="card" onclick="show('${r.id}')">
    <span class="badge">${r.category}</span>
    <h3>${r.title}</h3>
    ${r.servings?`<div class="meta">${r.servings}</div>`:''}
    <div class="excerpt">${r.excerpt}...</div>
    <div class="tags">${r.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
  </div>`;
}
function render(){
  renderChips();
  const q = norm(document.getElementById('q').value.trim());
  const list = RECIPES.filter(r =>
    (activeCat==='همه' || r.category===activeCat) &&
    (!q || norm(r.search).includes(q))
  );
  document.getElementById('grid').innerHTML = list.map(cardHTML).join('');
  document.getElementById('empty').style.display = list.length? 'none':'block';
}
function show(id){
  const r = RECIPES.find(x=>x.id===id);
  const d = document.getElementById('detail');
  d.innerHTML = `<button class="back" onclick="back()">→ برگشت به لیست</button>
  <div class="recipe">
    <span class="badge">${r.category}</span>
    <h2>${r.title}</h2>
    <div class="src">${r.source}${r.servings?` &nbsp;|&nbsp; ${r.servings}`:''}</div>
    ${r.intro?`<div class="note">${r.intro}</div>`:''}
    <h3 class="sec">لیست مواد</h3><div class="ing-box">${r.ingredients}</div>
    <h3 class="sec">طرز تهیه</h3>${r.method}
    ${r.notes?`<h3 class="sec">نکته‌ها</h3>${r.notes}`:''}
    <div class="tags" style="margin-top:20px">${r.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
  </div>`;
  document.getElementById('listView').style.display='none';
  d.style.display='block';
  window.scrollTo(0,0);
}
function back(){
  document.getElementById('detail').style.display='none';
  document.getElementById('listView').style.display='block';
}
document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
</html>
