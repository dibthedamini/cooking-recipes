<script>
const RECIPES = [{"title": "دیپ پنیر چیلی", "source": "Instagram reel — <a href=\"https://www.instagram.com/reel/DbI_tL-IKxI/\" target=\"_blank\" rel=\"noopener\">@cookandtestt</a> (رسپی از پیج cookalireza)", "servings": "جواب ۶ نفر", "intro": "نکته‌ی مهم: این دیپ کاملاً سرده — هیچ پختی نداره. فقط مواد رو خرد و مخلوط می‌کنی.", "ingredients": "<ul>\n<li>۴۰۰ گرم پنیر خامه‌ای (تقریباً یه بسته کامل + یه نصفه)</li>\n<li>۱ قاشق غذاخوری سس تند</li>\n<li>۱۰۰ گرم پپرونی (حدود ۵ قاشق غذاخوری پر، خردشده)</li>\n<li>۶ تا ۷ عدد خیارشور نمکی</li>\n<li>۳ قاشق غذاخوری پیازچه‌ی تازه‌ی خردشده</li>\n<li>پاپریکای دودی</li>\n<li>کمی نمک</li>\n<li>۱/۳ استکان آب</li>\n</ul>\n<p>برای سرو: چیپس تورتیلا یا نان تست</p>", "method": "<ol>\n<li>اول پنیر خامه‌ای رو از یخچال دربیار و بذار چند دقیقه‌ای دمای محیط بگیره. پنیرِ سردِ سفت رو سخت میشه هم زد و گوله‌گوله می‌مونه؛ ولی اگه کمی نرم بشه، راحت و یکدست مخلوط میشه.</li>\n</ol>\n<p>بعد با قاشق، کل ۴۰۰ گرم پنیر رو از بسته‌ش دربیار و بریز توی یه کاسه‌ی شیشه‌ای یا کاسه‌ی بزرگ. این کاسه ظرف اصلیِ کاره، پس یه چیزی انتخاب کن که هم زدن توش راحت باشه.</p>\n<ol>\n<li>۱ قاشق غذاخوری سس تند رو بریز روی پنیرِ توی کاسه. هنوز هم نزن — موادِ دیگه رو اول آماده می‌کنیم.</li>\n</ol>\n<ol>\n<li>خیارشورها رو از شیشه دربیار. ۶ تا ۷ عدد خیارشور نمکی رو روی تخته‌ی گوشت بذار و با چاقو ریز نگینی خرد کن — یعنی اول حلقه‌ای، بعد هر حلقه رو به مکعب‌های کوچیک تقسیم کن. هرچه ریزتر، دیپ یکدست‌تر و خوشمزه‌تر میشه.</li>\n</ol>\n<p>پپرونی رو هم همین‌جوری ریز نگینی خرد کن. (در ویدیو، تکه‌های ریزشده‌ی پپرونی و خیارشور آماده نشون داده شد و با چاقو از روی تخته به کاسه منتقل شدن.)</p>\n<ol>\n<li>پیازچه‌ها رو بشور و ریز حلقه‌ای خرد کن. حدود ۳ قاشق غذاخوری پیازچه‌ی خردشده برای داخل دیپ لازمه، ولی یه مقدارِ اضافه هم نگه دار برای تزیینِ آخر.</li>\n</ol>\n<ol>\n<li>حالا خیارشورِ خردشده، پپرونیِ خردشده و پیازچه رو بریز توی کاسه‌ی پنیر. بعد پاپریکای دودی و کمی نمک رو روشون بپاش.</li>\n</ol>\n<p>دقت: چون خیارشور خودش نمکیه، نمک رو کم بریز — آخرش می‌تونی مزه کنی و اضافه کنی.</p>\n<ol>\n<li>۱/۳ استکان آب رو بریز توی کاسه. این آب کمک می‌کنه دیپ روان و خامه‌ای بشه و سفت و خشک نمونه. اگه آب رو یکجا نریزی و کم‌کم اضافه کنی، کنترل بیشتری روی غلظت داری.</li>\n</ol>\n<ol>\n<li>حالا با قاشق، همه‌ی مواد رو خوب و حسابی هم بزن — چند دقیقه‌ای طول می‌کشه تا پنیر کاملاً با بقیه‌ی مواد یکی بشه و یه دیپِ کرمیِ زرد-نارنجیِ یکدست به دست بیاد. این مرحله مهم‌ترین مرحله‌ست؛ عجله نکن.</li>\n</ol>\n<p>مزه کن: اگه تندی بیشتر می‌خوای کمی سس تند اضافه کن، اگه نمکش کم بود کمی نمک.</p>\n<ol>\n<li>دیپ رو با قاشق منتقل کن به یه ظرف سروِ کوچیک (کاسه‌ی رنگی قشنگ‌تر میشه). روش رو با کمی پیازچه‌ی تازه، یه دونه خیارشورِ کامل و چند ورق پپرونیِ لوله‌شده تزیین کن.</li>\n</ol>\n<p>با چیپس تورتیلا یا نان تست سرو کن. می‌تونی توی یخچال نگهش داری؛ چون پخته نشده، تا چند روز توی ظرف دربسته تازه می‌مونه.</p>", "notes": "<ul>\n<li>چون هیچ پختی نداره، این دیپ برای مهمونی و دورهمی عالیه — سریع آماده میشه.</li>\n<li>پاپریکای دودی طعم دودیِ خاصی بهش میده؛ اگه نداری، پاپریکای معمولی هم کار می‌کنه ولی اون طعم دودی رو نداره.</li>\n</ul>", "id": "chili-cheese-dip", "category": "پیش‌غذا", "tags": ["دیپ", "بدون پخت", "سرد", "مهمونی"], "search": "دیپ پنیر چیلی نکته‌ی مهم: این دیپ کاملاً سرده — هیچ پختی نداره. فقط مواد رو خرد و مخلوط می‌کنی. ۴۰۰ گرم پنیر خامه‌ای (تقریباً یه بسته کامل + یه نصفه) ۱ قاشق غذاخوری سس تند ۱۰۰ گرم پپرونی (حدود ۵ قاشق غذاخوری پر، خردشده) ۶ تا ۷ عدد خیارشور نمکی ۳ قاشق غذاخوری پیازچه‌ی تازه‌ی خردشده پاپریکای دودی کمی نمک ۱/۳ استکان آب برای سرو: چیپس تورتیلا یا نان تست اول پنیر خامه‌ای رو از یخچال دربیار و بذار چند دقیقه‌ای دمای محیط بگیره. پنیرِ سردِ سفت رو سخت میشه هم زد و گوله‌گوله می‌مونه؛ ولی اگه کمی نرم بشه، راحت و یکدست مخلوط میشه. بعد با قاشق، کل ۴۰۰ گرم پنیر رو از بسته‌ش دربیار و بریز توی یه کاسه‌ی شیشه‌ای یا کاسه‌ی بزرگ. این کاسه ظرف اصلیِ کاره، پس یه چیزی انتخاب کن که هم زدن توش راحت باشه. ۱ قاشق غذاخوری سس تند رو بریز روی پنیرِ توی کاسه. هنوز هم نزن — موادِ دیگه رو اول آماده می‌کنیم. خیارشورها رو از شیشه دربیار. ۶ تا ۷ عدد خیارشور نمکی رو روی تخته‌ی گوشت بذار و با چاقو ریز نگینی خ n<ul>\n<li>سینه‌ی مرغ (تعداد مشخص نیست؛ معمولاً ۱ تا ۲ عدد)</li>\n<li>نمک و فلفل</li>\n<li>تخم‌مرغ (برای کاور — مقدار مشخص نیست)</li>\n<li>پودر سوخاری (مقدار مشخص نیست)</li>\n<li>روغن برای سرخ کردن (مقدار مشخص نیست)</li>\n</ul>\n<h4>سس خامه‌ای:</h4>\n<ul>\n<li>۲ قاشق غذاخوری کره</li>\n<li>۲ قاشق غذاخوری روغن زیتون</li>\n<li>۱ عدد پیاز کوچک</li>\n<li>۴ حبه سیر</li>\n<li>۳۰۰ میلی‌لیتر خامه‌ی غلیظ (دابل کریم / خامه‌ی صبحانه‌ی پرچرب)</li>\n<li>۱ قاشق چای‌خوری مخلوط سبزی خشک (میکس ایتالیایی)</li>\n<li>۱/۲ قاشق چای‌خوری نمک</li>\n<li>۱/۲ قاشق چای‌خوری فلفل پرک (چیلی فلکس)</li>\n<li>۱/۴ پیمانه آبِ پاستا</li>\n<li>۳ تا ۴ قاشق غذاخوری پارمزان رنده‌شده</li>\n<li>اسپاگتی (مقدار مشخص نیست)</li>\n<li>جعفری تازه</li>\n</ul>", "method": "<ol>\n<li>سینه‌ی مرغ رو از وسط به صورت افقی نصف کن تا دو ورقه‌ی نازک‌تر به دست بیاد. (اگه سینه ضخیمه، این کار باعث میشه یکدست و سریع بپزه.)</li>\n</ol>\n<p>یه لایه سلفون یا کیسه فریزر بکش روی ورقه‌های مرغ و با بیفتک‌کوب (گوشت‌کوب) آروم بکوب تا نازک و یکدست بشن. چرا می‌کوبیم؟ چون گوشتِ نازک‌شده هم سریع‌تر می‌پزه، هم بافتش نرم‌تر میشه و هم همه‌جاش یکدست سرخ میشه.</p>\n<ol>\n<li>دو طرف ورقه‌های مرغ رو نمک و فلفل بزن.</li>\n</ol>\n<ol>\n<li>برای کاور سوخاری: تخم‌مرغ رو توی یه بشقاب گود بشکن و با چنگال هم بزن. پودر سوخاری رو هم توی یه بشقاب دیگه بریز.</li>\n</ol>\n<p>اول هر ورقه مرغ رو کامل بزن توی تخم‌مرغ (هر دو طرف)، بذار اضافه‌ش بچکه، بعد بغلتون توی پودر سوخاری و با دست فشار بده تا همه‌جاش پوشیده بشه. تخم‌مرغ نقش چسب رو داره که سوخاری به مرغ بچسبه.</p>\n<ol>\n<li>توی یه ماهیتابه روغن بریز و بذار داغ بشه (سرخِ کم‌عمق — روغن به اندازه‌ای که کف ماهیتابه رو بپوشونه و نصف ضخامت مرغ رو بگیره).</li>\n</ol>\n<p>کتلت‌ها رو بنداز توی روغن داغ. چون مرغ خیلی نازکه، خیلی سریع می‌پزه: حدود ۲ دقیقه هر طرف، تا طلایی بشن.</p>\n<p>نشونه‌ی پخت کامل: در ویدیو با دماسنج دیجیتال نشون داده شد که دمای داخل مرغ باید به ۷۵ درجه‌ی سانتی‌گراد برسه. اگه دماسنج نداری، یه برش کوچیک بزن وسط ضخیم‌ترین قسمتش — نباید هیچ قسمت صورتی یا خامی دیده بشه و آبش باید شفاف باشه، نه صورتی.</p> ngredients": "<h4>مرینیت مرغ:</h4>\n<ul>\n<li>۱ عدد سینه‌ی مرغ</li>\n<li>نصف پیمانه شیر</li>\n<li>نصف پیمانه ماست</li>\n<li>۲ قاشق غذاخوری سس تند</li>\n<li>پاپریکای دودی، پودر سیر، پودر پیاز، فلفل سیاه — از هر کدام ۱ قاشق چای‌خوری</li>\n<li>چند قطره آب‌لیمو</li>\n</ul>\n<h4>مواد خشک (کاور سوخاری):</h4>\n<ul>\n<li>۱/۵ لیوان آرد گندم</li>\n<li>۱/۴ پیمانه نشاسته‌ی ذرت</li>\n<li>۱ قاشق غذاخوری بکینگ‌پودر (اگر داشتی)</li>\n<li>نمک، فلفل سیاه، پاپریکا، پودر پیاز، پودر سیر — از هر کدام ۱ قاشق چای‌خوری</li>\n</ul>\n<h4>سس هات هانی:</h4>\n<ul>\n<li>۱/۲ پیمانه سس تند</li>\n<li>۱/۲ پیمانه عسل</li>\n<li>۲ قاشق غذاخوری کره</li>\n<li>۵ حبه سیر، خردشده</li>\n<li>پاپریکای دودی و فلفل پرک — ۱ قاشق چای‌خوری (یا ۲ قاشق غذاخوری معجون فلفل)</li>\n</ul>\n<h4>سس رنچ:</h4>\n<ul>\n<li>۳ قاشق غذاخوری ماست یونانی</li>\n<li>۲ قاشق غذاخوری مایونز</li>\n<li>۲ قاشق غذاخوری آب‌لیمو</li>\n<li>شوید و جعفری خشک، پودر پیاز، پودر سیر، نمک و فلفل — به میزان دلخواه</li>\n</ul>", "method": "<ol>\n<li>سینه‌ی مرغ رو بشور و خشک کن، بعد به نوارهای بلند و هم‌اندازه (مثل انگشت) برش بزن — اینا همون «تندر»های مرغ هستن. برشِ هم‌اندازه خیلی مهمه چون اگه یکی کلفت و یکی نازک باشه، نازک‌ها می‌سوزن و کلفت‌ها خام می‌مونن.</li>\n</ol>\n<p>نوارها رو بریز توی یه کاسه‌ی شیشه‌ای. نصف پیمانه شیر، نصف پیمانه ماست، ۲ قاشق غذاخوری سس تند، از هر ادویه ۱ قاشق چای‌خوری (پاپریکای دودی، پودر سیر، پودر پیاز، فلفل سیاه) و چند قطره آب‌لیمو رو اضافه کن و با دست یا قاشق خوب مخلوط کن تا همه‌ی نوارها به مرینیت آغشته بشن.</p>\n<p>(زمان مرینیت در ویدیو مشخص نیست — احتمالاً در توضیح صوتی گفته شده. راهنمای کلی: حداقل ۱ تا ۲ ساعت در یخچال، و اگه وقت داری یک شب تا صبح، طعمش خیلی بهتر میشه. شیر و ماست بافت مرغ رو نرم و آبدار می‌کنن.)</p>\n<ol>\n<li>مواد خشک رو توی یه ظرف تخت و پهن (مثل سینی یا بشقاب گود) با هم مخلوط کن: آرد، نشاسته‌ی ذرت، بکینگ‌پودر و ادویه‌ها. نشاسته‌ی ذرت رازِ تردیِ کاوره — حذفش نکن.</li>\n</ol>\n<p>نوارهای مرغ رو یکی‌یکی از مرینیت دربیار (بذار اضافه‌ی مرینیت بچکه) و بغلتون توی مخلوط آرد. با دست آرد رو روی مرغ فشار بده و بپاش تا رم ولی کمی سفت وسطش حس بشه.</p>\n<p>قبل از آبکش کردن، با یه پیمانه حدود ۱۵۰ میلی‌لیتر از آبِ پاستا رو نگه دار (نشاسته‌ی این آب سس رو غلیظ و یکدست می‌کنه، خیلی مهمه). بعد پاستا رو آبکش کن و بذار کنار تا کمی از داغی بیفته — توی این دستور پاستا سرد/ولرم سرو میشه، پس عجله نکن.</p>\n<h4>۲. سس خامه‌ای رو درست کن.</h4>\n<p>توی یه کاسه‌ی بزرگ، ۵۰۰ گرم اسکیر رو بریز. ۱۲۰ میلی‌لیتر از آبِ پاستایی که نگه داشتی رو اضافه کن و با همزن دستی یا قاشق هم بزن تا یکدست و رقیق بشه. بعد ۳ قاشق غذاخوری پستوی قرمز، ۱ قاشق چای‌خوری پر پودر پیاز، ۲ حبه سیرِ رنده یا له‌شده، ۲ قاشق چای‌خوری وگتا و کمی فلفل رو اضافه کن و دوباره خوب هم بزن تا سس یه رنگ و غلظت یکنواخت بگیره. مزه کن؛ اگه کم‌نمک بود کمی نمک اضافه کن.</p>\n<p>حالا پاستای آبکش‌شده رو که کمی خنک شده، بریز توی کاسه‌ی سس و با کفگیر همه رو آروم زیر و رو کن تا همه‌ی پاستاها به سس آغشته بشن. بذار کنار.</p>\n<h4>۳. سالاد گوجه رو آماده کن.</h4>\n<p>گوجه‌های گیلاسی رو از وسط نصف کن و بریز توی یه کاسه. پیازچه‌ها رو ریز حلقه‌ای خرد کن و اضافه کن. توی یه کاسه‌ی کوچیک، ۱ قاشق غذاخوری شیره‌ی انار، ۱ قاشق غذاخوری آب‌لیمو، نصف قاشق چای‌خوری شوید، نصف قاشق چای‌خوری نمک و روغن زیتون رو با هم مخلوط کن و بریز روی گوجه‌ها. آروم هم بزن تا همه به سس آغشته بشن.</p>\n<h4>۴. مرغ رو بپز.</h4>\n<p>سینه‌ی مرغ رو اول با دستمال کاغذی کاملاً خشک کن (این کار باعث میشه مرغ سرخ و طلایی بشه، نه اینکه بخارپز بشه). بعد به تکه‌های هم‌اندازه برش بزن — مثلاً مکعب‌های ۲ تا ۳ سانتی یا نوارهای انگشتی — تا همه یکدست بپزن. دو طرف تکه‌ها رو با نمک و پاپریکا مزه‌دار کن.</p>\n<p>یه ماهیتابه رو روی شعله‌ی متوسط‌رو‌به‌زیاد بذار و کمی روغن بریز؛ صبر کن روغن کاملاً داغ بشه (یه قطره آب بپاش، اگه سیز کرد آماده‌ست). تکه‌های مرغ رو بچین توی ماهیتابه طوری که به هم نچسبن و شلوغ نشه (اگه جا کم بود، در دو مرحله سرخ کن). هر طرف رو حدود ۴ تا ۵ دقیقه سرخ کن تا طلایی بشه. برای مطمئن شدن از پخت، یه تکه رو نصف کن — داخلش نباید صورتی باشه. مرغ‌های پخته رو بذار روی یه بشقاب و چند دقیقه استراحت بده تا آبشون حفظ بشه.</p>\n<h4>۵. سرو کن.</h4>\n<p>پاستای سس‌دار رو بکش توی بشقاب، سالاد گوجه رو روش بریز و ت const CATEGORIES = ["پیش‌غذا", "غذای اصلی"];

const norm = s => (s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
let activeCat = 'همه';
function renderChips(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  ['همه', ...CATEGORIES].forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip' + (c===activeCat?' active':'');
    b.textContent = c;
    b.onclick = ()=>{activeCat=c;render();};
    box.appendChild(b);
  });
}
function cardHTML(r){
  return `<div class="card" onclick="show('${r.id}')">
    <span class="badge">${r.category}</span>
    <h3>${r.title}</h3>
    ${r.servings?`<div class="meta">${r.servings}</div>`:''}
    <div class="excerpt">${r.excerpt}...</div>
    <div class="tags">${r.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
  </div>`;
}
function render(){
  renderChips();
  const q = norm(document.getElementById('q').value.trim());
  const list = RECIPES.filter(r =>
    (activeCat==='همه' || r.category===activeCat) &&
    (!q || norm(r.search).includes(q))
  );
  document.getElementById('grid').innerHTML = list.map(cardHTML).join('');
  document.getElementById('empty').style.display = list.length? 'none':'block';
}
function show(id){
  const r = RECIPES.find(x=>x.id===id);
  const d = document.getElementById('detail');
  d.innerHTML = `<button class="back" onclick="back()">→ برگشت به لیست</button>
  <div class="recipe">
    <span class="badge">${r.category}</span>
    <h2>${r.title}</h2>
    <div class="src">${r.source}${r.servings?` &nbsp;|&nbsp; ${r.servings}`:''}</div>
    ${r.intro?`<div class="note">${r.intro}</div>`:''}
    <h3 class="sec">لیست مواد</h3><div class="ing-box">${r.ingredients}</div>
    <h3 class="sec">طرز تهیه</h3>${r.method}
    ${r.notes?`<h3 class="sec">نکته‌ها</h3>${r.notes}`:''}
    <div class="tags" style="margin-top:20px">${r.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
  </div>`;
  document.getElementById('listView').style.display='none';
  d.style.display='block';
  window.scrollTo(0,0);
}
function back(){
  document.getElementById('detail').style.display='none';
  document.getElementById('listView').style.display='block';
}
document.getElementById('q').addEventListener('input', render);
render();
</script>
